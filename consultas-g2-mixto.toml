#  Declaración del set COMPLEMENTARIO de consultas mixtas — una por imagen.
#
#  Qué es: las mismas 10 imágenes de `consultas-g2.toml`, con UN pedido por imagen que combina
#  las tres cosas que el set de 30 prueba por separado: un cambio visual (cromático), una
#  restricción cultural/técnica/de período que activa el filtro de metadata, y un adjetivo vago.
#  Instrumento aparte: no toca el set de 30 ni sus 634 juicios, y no se elige solo cuando
#  hay más de un set completo (hay que pasar `--autoria grupo-2-mixto`).
#
#  Diseño: 9 de los 10 pedidos activan al menos un eje del filtro (cultura, técnica,
#  período, época); `c06-mixto` NO activa ninguno y es el control. Cada pedido se probó contra
#  el filtro y la intersección de sus ejes deja >= 27 obras del corpus indexado (2.605).
#
#  Para autorar (no gasta API):
#    poetry run tp3-consultas autorar --declaracion consultas-g2-mixto.toml

split_id = "5b6cba32126fed61"
autoria  = "grupo-2-mixto"
estado   = "completo"
criterio_de_culture = "primer_componente_por_coma"
nota = "Set complementario de 10 consultas mixtas sobre las mismas 10 imágenes de grupo-2. La rúbrica de juicio es docs/rubrica-mixta.md y no está en el pool ni en el kappa del set de 30."

[revision]
n_imagenes_revisadas = 30
como_se_revisaron = "Las 10 imágenes son las del set grupo-2 (ver consultas-g2.toml: lista corta de 30 candidatas revisadas como hoja de contactos). Acá no se eligieron imágenes nuevas: se escribió un pedido mixto por imagen para poder comparar de a pares con sus pedidos visual, conceptual y ambiguo."

