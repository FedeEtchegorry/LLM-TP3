#  Declaración del `SetDeConsultas` — el set de consultas, la evaluación.
#
#  🔴 Clase 3: se congela una vez. Corregir después de congelar no edita el
#  set — autora **otro**, y los juicios del anterior quedan sin con qué
#  compararse.
#
#  Las 10 salieron de la lista corta de 30 (`tp3-consultas candidatas`), que
#  cubre los 6 períodos, los 2 museos y 28 de las 36 culturas del held-out.

split_id = "5b6cba32126fed61"
autoria  = "grupo-2"
estado   = "completo"
criterio_de_culture = "primer_componente_por_coma"

[revision]
n_imagenes_revisadas = 30
como_se_revisaron = "la lista corta de 30 candidatas de `tp3-consultas candidatas` (criterio: cobertura por valor de cada eje — periodo × cultura × tecnica × museo × tiene_artista — semilla 7369), revisadas como hoja de contactos. De las 30 se eligieron 10 para cubrir los tipos que la evaluación pide: paisaje, marina, interior, abstracta, retrato (×3), escena narrativa y motivo botánico. Las 8 culturas que quedaron afuera de la lista corta son valores de 1-2 obras del held-out."

#  ── 01 · paisaje, paleta fría ──────────────────────────────────────────────
[[imagenes]]
artwork_id = "cma:109240"
atributos = ["paisaje", "paleta_fria", "oleo", "rural"]

[[imagenes.consultas]]
consulta_id = "c01-visual"
categoria   = "visual_cromatico"
pedido      = "versiones más cálidas de este paisaje"

[[imagenes.consultas]]
consulta_id = "c01-conceptual"
categoria   = "conceptual_cultural"
pedido      = "el mismo paisaje pero pintado en Japón"
cultura_pedida = { nombre = "Japón", etiquetas = ["Japan"] }

[[imagenes.consultas]]
consulta_id = "c01-ambiguo"
categoria   = "ambiguo"
pedido      = "con más vida"

